    <!-- Pre-paint: apply the saved light/dark choice and cached theme tokens before anything renders. -->
    <script>
      (function () {
        try {
          var d = document.documentElement, ls = localStorage, s = ls.getItem("m3-scheme");
          var dark = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          d.dataset.scheme = dark ? "dark" : "light";
          var c = JSON.parse(ls.getItem("m3-theme-cache") || "null");
          if (c && c.dark === dark && c.color === (ls.getItem("m3-theme-color") || "#4CAF50")) {
            var st = document.createElement("style");
            st.id = "theme-cache";
            st.textContent = "html{" + c.css + "}";
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>
